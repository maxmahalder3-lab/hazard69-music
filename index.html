<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HAZARD 69 — OFFICIAL</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  background:#030303;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
  overflow-x:hidden;
}

/* ===== PREMIUM OPENING ===== */

#opening{
  position:fixed;
  inset:0;
  z-index:9999;

  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;

  background:
    radial-gradient(circle at 50% 45%,
      rgba(100,0,0,.45),
      transparent 30%),
    linear-gradient(135deg,#000,#100000,#000);

  transition:opacity 1.2s ease;
}

#opening:after{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;

  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(255,0,0,.05),
      transparent
    );

  animation:scan 4s linear infinite;
}

@keyframes scan{
  0%{transform:translateX(-100%)}
  100%{transform:translateX(100%)}
}

/* LOGO */

.logo-wrap{
  width:min(78vw,520px);
  perspective:1200px;
  z-index:2;

  animation:logoIntro 2.2s cubic-bezier(.16,1,.3,1);
}

.logo-wrap img{
  width:100%;
  display:block;

  filter:
    drop-shadow(0 3px 0 #555)
    drop-shadow(0 7px 0 #222)
    drop-shadow(0 0 12px #fff)
    drop-shadow(0 0 35px rgba(255,0,0,.8));

  animation:logoFloat 4s ease-in-out infinite;
}

@keyframes logoIntro{
  0%{
    opacity:0;
    transform:
      perspective(1200px)
      rotateX(70deg)
      scale(.45);
    filter:blur(20px);
  }

  70%{
    opacity:1;
    transform:
      perspective(1200px)
      rotateX(-8deg)
      scale(1.05);
  }

  100%{
    opacity:1;
    transform:
      perspective(1200px)
      rotateX(0)
      scale(1);
  }
}

@keyframes logoFloat{
  0%,100%{
    transform:
      perspective(1200px)
      rotateY(-2deg)
      translateY(0);
  }

  50%{
    transform:
      perspective(1200px)
      rotateY(2deg)
      translateY(-7px);
  }
}

/* TITLE */

.opening-title{
  z-index:2;
  margin-top:12px;

  font-size:clamp(18px,5vw,32px);
  font-weight:800;
  letter-spacing:9px;

  color:#eee;

  text-shadow:
    0 0 12px #fff,
    0 0 35px rgba(255,0,0,.8);

  animation:fadeUp 1.3s 1s forwards;
  opacity:0;
}

/* ENTER */

.enter{
  z-index:2;

  margin-top:40px;
  padding:16px 48px;

  border:1px solid rgba(255,255,255,.8);
  border-radius:50px;

  background:rgba(255,255,255,.04);
  backdrop-filter:blur(12px);

  color:#fff;

  font-size:14px;
  font-weight:bold;
  letter-spacing:4px;

  cursor:pointer;

  animation:fadeUp 1.3s 1.5s forwards;
  opacity:0;

  transition:.35s;
}

.enter:hover{
  background:#fff;
  color:#000;

  transform:scale(1.06);

  box-shadow:
    0 0 20px #fff,
    0 0 50px rgba(255,0,0,.8);
}

@keyframes fadeUp{
  from{
    opacity:0;
    transform:translateY(25px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }
}

/* ===== HOME ===== */

#home{
  display:none;
  min-height:100vh;

  background:
    radial-gradient(
      circle at 50% 0%,
      rgba(100,0,0,.45),
      transparent 35%
    ),
    linear-gradient(180deg,#080808,#020202 70%);

  padding-bottom:70px;
}

/* TOP */

.hero{
  min-height:80vh;

  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;

  text-align:center;

  padding:60px 20px;
}

.hero-logo{
  width:min(58vw,330px);

  filter:
    drop-shadow(0 0 10px #fff)
    drop-shadow(0 0 35px rgba(255,0,0,.8));

  animation:heroFloat 4s ease-in-out infinite;
}

@keyframes heroFloat{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-10px)}
}

.hero h1{
  margin-top:28px;

  font-size:clamp(38px,9vw,72px);
  letter-spacing:9px;

  font-weight:900;

  text-shadow:
    0 0 15px #fff,
    0 0 45px rgba(255,0,0,.7);
}

.hero p{
  margin-top:12px;

  color:#888;
  letter-spacing:5px;
  font-size:13px;
}

/* ===== PREMIUM CARDS ===== */

.container{
  width:min(900px,92%);
  margin:auto;
}

.card{
  margin:22px 0;

  padding:35px 25px;

  text-align:center;

  border:1px solid rgba(255,255,255,.10);
  border-radius:24px;

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.07),
      rgba(255,255,255,.015)
    );

  backdrop-filter:blur(15px);

  box-shadow:
    0 20px 60px rgba(0,0,0,.5),
    inset 0 1px rgba(255,255,255,.08);

  transition:.4s;
}

.card:hover{
  transform:translateY(-5px);

  border-color:rgba(255,0,0,.35);

  box-shadow:
    0 25px 70px rgba(0,0,0,.6),
    0 0 35px rgba(255,0,0,.12);
}

.card h2{
  font-size:24px;
  letter-spacing:3px;
}

.card p{
  margin-top:10px;
  color:#888;
}

/* ===== MUSIC ===== */

.music-btn{
  margin-top:22px;

  padding:14px 32px;

  border:1px solid rgba(255,255,255,.5);
  border-radius:50px;

  background:#0b0b0b;
  color:#fff;

  font-weight:bold;
  letter-spacing:2px;

  cursor:pointer;

  transition:.3s;
}

.music-btn:hover{
  background:#fff;
  color:#000;

  box-shadow:
    0 0 25px rgba(255,0,0,.7);
}

/* ===== SOCIAL ===== */

.buttons{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;

  gap:14px;

  margin-top:25px;
}

.btn{
  min-width:210px;

  padding:15px 24px;

  border-radius:50px;

  color:white;
  text-decoration:none;

  font-weight:bold;

  transition:.35s;
}

.btn:hover{
  transform:translateY(-4px) scale(1.02);
}

.instagram{
  background:
    linear-gradient(
      45deg,
      #833ab4,
      #fd1d1d,
      #fcb045
    );

  box-shadow:
    0 10px 30px rgba(253,29,29,.18);
}

.email{
  background:
    linear-gradient(135deg,#171717,#444);
}

/* ===== CONTACT ===== */

.contact-icon{
  font-size:42px;
  margin-bottom:15px;
}

/* ===== FOOTER ===== */

footer{
  text-align:center;

  margin-top:55px;

  color:#555;

  font-size:12px;
  letter-spacing:2px;
}

/* ===== MOBILE ===== */

@media(max-width:600px){

  .logo-wrap{
    width:82vw;
  }

  .hero{
    min-height:75vh;
  }

  .hero h1{
    letter-spacing:5px;
  }

  .card{
    padding:28px 18px;
  }

  .btn{
    width:100%;
  }

}
</style>
</head>

<body>

<!-- ===== OPENING ===== -->

<section id="opening">

  <div class="logo-wrap">
    <img src="logo.png" alt="HAZARD 69">
  </div>

  <div class="opening-title">
    HAZARD 69
  </div>

  <button class="enter" onclick="enterWebsite()">
    ENTER WEBSITE
  </button>

</section>


<!-- ===== MUSIC ===== -->

<audio id="music" loop preload="auto">
  <source src="music.mp3" type="audio/mpeg">
</audio>


<!-- ===== HOME ===== -->

<main id="home">

  <section class="hero">

    <img
      src="logo.png"
      class="hero-logo"
      alt="HAZARD 69 Official Logo">

    <h1>HAZARD 69</h1>

    <p>OFFICIAL WEBSITE</p>

  </section>


  <div class="container">


    <!-- MUSIC -->

    <section class="card">

      <h2>🎵 OFFICIAL MUSIC</h2>

      <p>
        Experience HAZARD 69
      </p>

      <button
        id="musicButton"
        class="music-btn"
        onclick="toggleMusic()">

        ▶ PLAY MUSIC

      </button>

    </section>


    <!-- INSTAGRAM -->

    <section class="card">

      <h2>📸 INSTAGRAM</h2>

      <p>
        Follow HAZARD 69 Official
      </p>

      <div class="buttons">

        <a
          class="btn instagram"
          href="https://www.instagram.com/hazard_69_official/"
          target="_blank"
          rel="noopener">

          FOLLOW ON INSTAGRAM

        </a>

      </div>

    </section>


    <!-- CONTACT -->

    <section class="card">

      <div class="contact-icon">
        📩
      </div>

      <h2>CONTACT</h2>

      <p>
        Business • Collaboration • Enquiries
      </p>

      <div class="buttons">

        <a
          class="btn email"
          href="mailto:maxmahalder3@gmail.com">

          ✉️ EMAIL HAZARD 69

        </a>

      </div>

    </section>


  </div>


  <footer>
    © 2026 HAZARD 69 OFFICIAL
  </footer>

</main>


<script>

const music =
  document.getElementById("music");

const musicButton =
  document.getElementById("musicButton");


function enterWebsite(){

  const opening =
    document.getElementById("opening");

  opening.style.opacity="0";

  setTimeout(function(){

    opening.style.display="none";

    document.getElementById("home")
      .style.display="block";

    document.body.style.overflow="auto";

  },1200);


  music.play()
    .then(function(){

      musicButton.innerHTML=
        "⏸ PAUSE MUSIC";

    })
    .catch(function(){

      musicButton.innerHTML=
        "▶ PLAY MUSIC";

    });

}


function toggleMusic(){

  if(music.paused){

    music.play()
      .then(function(){

        musicButton.innerHTML=
          "⏸ PAUSE MUSIC";

      });

  }else{

    music.pause();

    musicButton.innerHTML=
      "▶ PLAY MUSIC";

  }

}

</script>

</body>
</html>
