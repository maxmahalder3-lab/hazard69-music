
@<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HAZARD 69 OFFICIAL</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
  background:#000;
  color:#fff;
  font-family:Arial,sans-serif;
  overflow:hidden;
}

#opening{
  position:fixed;
  inset:0;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  background:radial-gradient(circle,#202020,#050505 55%,#000);
  z-index:10;
}

.logo{
  font-size:clamp(55px,14vw,120px);
  font-weight:900;
  letter-spacing:10px;
  text-shadow:0 0 10px #fff,0 0 30px #f00,0 0 60px #f00;
  animation:logo 2s ease infinite alternate;
}

.subtitle{
  margin-top:12px;
  letter-spacing:6px;
  color:#aaa;
}

.enter{
  margin-top:45px;
  padding:16px 42px;
  border:2px solid #fff;
  background:transparent;
  color:#fff;
  border-radius:40px;
  font-weight:bold;
  letter-spacing:3px;
  cursor:pointer;
  transition:.3s;
}

.enter:hover{
  background:#fff;
  color:#000;
  box-shadow:0 0 35px #fff;
}

#home{
  display:none;
  min-height:100vh;
  padding:60px 20px;
  text-align:center;
  background:linear-gradient(135deg,#000,#180000,#000);
}

#home h1{
  font-size:50px;
  letter-spacing:8px;
  text-shadow:0 0 25px red;
}

#home p{
  margin-top:15px;
  color:#aaa;
}

.buttons{
  margin-top:40px;
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:15px;
}

.btn{
  display:inline-block;
  padding:14px 25px;
  border:1px solid #fff;
  border-radius:30px;
  color:#fff;
  text-decoration:none;
  transition:.3s;
}

.btn:hover{
  background:#fff;
  color:#000;
}

@keyframes logo{
  from{transform:scale(1)}
  to{transform:scale(1.06)}
}
</style>
</head>

<body>

<audio id="music" loop>
<source src="Alan%20Walker_%20Sabrina%20Carpenter%20_%20Farruko%20-%20On%20My%20Way(MP3_160K).mp3" type="audio/mpeg">
</audio>

<section id="opening">
  <div class="logo">HAZARD 69</div>
  <div class="subtitle">OFFICIAL WEBSITE</div>

  <button class="enter" onclick="enterSite()">
    ENTER WEBSITE
  </button>
</section>

<section id="home">
  <h1>HAZARD 69</h1>
  <p>WELCOME TO THE OFFICIAL WEBSITE</p>

  <div class="buttons">
    <a class="btn"
       href="https://www.instagram.com/hazard_69_official/"
       target="_blank">
       📸 INSTAGRAM
    </a>

    <a class="btn"
       href="https://sites.google.com/view/hazard69official/home"
       target="_blank">
       🌐 OFFICIAL SITE
    </a>

    <button class="btn" onclick="toggleMusic()">
       🎵 MUSIC
    </button>
  </div>
</section>

<script>
function enterSite(){
  const music=document.getElementById("music");

  music.play().catch(()=>{});

  document.getElementById("opening").style.display="none";
  document.getElementById("home").style.display="block";
}

function toggleMusic(){
  const music=document.getElementById("music");

  if(music.paused){
    music.play().catch(()=>{});
  }else{
    music.pause();
  }
}
</script>

</body>
</html>
