<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HAZARD 69 OFFICIAL</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:#050505;
  color:white;
  font-family:Arial, sans-serif;
  overflow-x:hidden;
}

/* OPENING */
#opening{
  position:fixed;
  inset:0;
  background:
    radial-gradient(circle at center,#222 0%,#080808 45%,#000 100%);
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  z-index:9999;
  transition:1s;
}

.logo{
  width:230px;
  max-width:70%;
  animation:logoIn 2s ease forwards,
            glow 2s infinite alternate;
}

@keyframes logoIn{
  from{
    opacity:0;
    transform:scale(.3) rotate(-15deg);
  }
  to{
    opacity:1;
    transform:scale(1) rotate(0);
  }
}

@keyframes glow{
  from{
    filter:drop-shadow(0 0 5px #fff);
  }
  to{
    filter:drop-shadow(0 0 30px #fff);
  }
}

.opening-title{
  margin-top:25px;
  font-size:32px;
  letter-spacing:7px;
  font-weight:bold;
  animation:fade 2s ease;
}

@keyframes fade{
  from{opacity:0}
  to{opacity:1}
}

.enter{
  margin-top:35px;
  padding:15px 38px;
  border:2px solid white;
  border-radius:40px;
  background:transparent;
  color:white;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
  transition:.3s;
}

.enter:hover{
  background:white;
  color:black;
  box-shadow:0 0 30px white;
}

/* HOME */
#home{
  min-height:100vh;
  padding:50px 20px;
  text-align:center;
  background:
    linear-gradient(rgba(0,0,0,.65),rgba(0,0,0,.9)),
    radial-gradient(circle,#222,#000 70%);
}

.home-logo{
  width:180px;
  margin-top:20px;
  filter:drop-shadow(0 0 20px rgba(255,255,255,.5));
}

h1{
  margin-top:20px;
  font-size:42px;
  letter-spacing:5px;
}

.subtitle{
  margin-top:10px;
  color:#aaa;
  font-size:16px;
}

/* MUSIC */
.music-box{
  margin:35px auto;
  max-width:420px;
  padding:25px;
  border:1px solid #333;
  border-radius:20px;
  background:#111;
  box-shadow:0 0 30px rgba(255,255,255,.08);
}

.music-btn{
  padding:13px 28px;
  border:none;
  border-radius:30px;
  background:white;
  color:black;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.music-btn:hover{
  transform:scale(1.05);
}

/* INSTAGRAM */
.instagram{
  margin:40px auto;
  max-width:500px;
  padding:30px 20px;
  border-radius:22px;
  background:linear-gradient(145deg,#111,#050505);
  border:1px solid #333;
}

.instagram h2{
  font-size:27px;
  margin-bottom:10px;
}

.instagram p{
  color:#aaa;
  margin-bottom:20px;
}

.insta-btn{
  display:inline-block;
  padding:14px 30px;
  border-radius:30px;
  text-decoration:none;
  color:white;
  font-weight:bold;
  background:linear-gradient(45deg,#833ab4,#fd1d1d,#fcb045);
  box-shadow:0 0 20px rgba(253,29,29,.3);
}

.insta-btn:hover{
  transform:scale(1.05);
}

/* FOOTER */
footer{
  margin-top:50px;
  padding:25px;
  color:#777;
  font-size:13px;
}
</style>
</head>

<body>

<!-- OPENING PAGE -->
<section id="opening">

  <!-- Logo -->
  <img
    src="logo.png"
    class="logo"
    alt="HAZARD 69 Logo"
  >

  <div class="opening-title">
    HAZARD 69
  </div>

  <button class="enter" onclick="enterWebsite()">
    ENTER WEBSITE
  </button>

</section>


<!-- MUSIC -->
<audio id="bgMusic" loop>
  <source src="Alan Walker_ Sabrina Carpenter_ Farruko - On My Way.mp3"
          type="audio/mpeg">
</audio>


<!-- HOME -->
<main id="home">

  <img
    src="logo.png"
    class="home-logo"
    alt="HAZARD 69"
  >

  <h1>HAZARD 69</h1>

  <p class="subtitle">
    OFFICIAL WEBSITE
  </p>


  <!-- MUSIC PLAYER -->
  <div class="music-box">

    <h2>🎵 Background Music</h2>

    <br>

    <button
      class="music-btn"
      id="musicButton"
      onclick="toggleMusic()">
      ▶ PLAY MUSIC
    </button>

  </div>


  <!-- INSTAGRAM -->
  <section class="instagram">

    <h2>📸 Instagram</h2>

    <p>
      Follow HAZARD 69 on Instagram
    </p>

    <a
      class="insta-btn"
      href="https://www.instagram.com/hazard_69_official/"
      target="_blank">
      FOLLOW ON INSTAGRAM
    </a>

  </section>


  <footer>
    © 2026 HAZARD 69 OFFICIAL
  </footer>

</main>


<script>

const music = document.getElementById("bgMusic");
const button = document.getElementById("musicButton");


function enterWebsite(){

  document.getElementById("opening").style.opacity="0";

  setTimeout(()=>{
    document.getElementById("opening").style.display="none";
  },1000);

  /*
    Browser autoplay restrictions:
    Music starts after the user taps ENTER.
  */

  music.play()
    .then(()=>{
      button.innerHTML="⏸ PAUSE MUSIC";
    })
    .catch(()=>{
      button.innerHTML="▶ PLAY MUSIC";
    });
}


function toggleMusic(){

  if(music.paused){

    music.play()
      .then(()=>{
        button.innerHTML="⏸ PAUSE MUSIC";
      });

  }else{

    music.pause();
    button.innerHTML="▶ PLAY MUSIC";

  }

}

</script>

</body>
</html>
<!-- CONTACT SECTION -->
<section class="contact">

  <div class="contact-icon">📩</div>

  <h2>CONTACT HAZARD 69</h2>

  <p>
    For business, collaboration or general enquiries
  </p>

  <div class="contact-buttons">

    <a
      href="mailto:maxmahalder3@gmail.com"
      class="contact-btn">
      ✉️ EMAIL US
    </a>

    <a
      href="https://www.instagram.com/hazard_69_official/"
      target="_blank"
      rel="noopener noreferrer"
      class="contact-btn instagram-contact">
      📸 INSTAGRAM
    </a>

  </div>

</section>
