<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HAZARD 69 OFFICIAL</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:#000;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
  overflow:hidden;
}

/* ===== OPENING ===== */

#opening{
  position:fixed;
  inset:0;
  z-index:9999;

  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;

  background:
    radial-gradient(circle at center,
    #242424 0%,
    #090909 45%,
    #000 100%);

  animation:openingIn 1.5s ease;
}

/* Background glow */

#opening::before{
  content:"";
  position:absolute;
  width:350px;
  height:350px;
  border-radius:50%;
  background:#ff0000;
  filter:blur(130px);
  opacity:.18;
  animation:redGlow 2s infinite alternate;
}

/* LOGO */

.logo{
  position:relative;
  width:min(75vw,500px);

  opacity:0;
  transform:scale(.5);
  animation:logoEnter 2s .4s forwards;
}

.logo img{
  width:100%;
  height:auto;
  display:block;

  filter:
    drop-shadow(0 0 8px #fff)
    drop-shadow(0 0 25px #ff0000)
    drop-shadow(0 0 55px #ff0000);

  animation:logoPulse 2s 2.4s infinite alternate;
}

/* Subtitle */

.subtitle{
  position:relative;

  margin-top:18px;

  font-size:14px;
  letter-spacing:7px;
  color:#aaa;

  opacity:0;
  animation:fadeUp 1.2s 1.7s forwards;
}

/* ENTER BUTTON */

.enter{
  position:relative;

  margin-top:45px;

  padding:16px 48px;

  border:2px solid #fff;
  border-radius:50px;

  background:transparent;
  color:#fff;

  font-size:16px;
  font-weight:bold;
  letter-spacing:4px;

  cursor:pointer;

  opacity:0;
  animation:fadeUp 1.2s 2s forwards;

  transition:.35s;
}

.enter:hover{
  background:#fff;
  color:#000;

  transform:scale(1.06);

  box-shadow:
    0 0 15px #fff,
    0 0 40px #ff0000;
}

/* ===== HOME ===== */

#home{
  display:none;

  min-height:100vh;

  padding:70px 20px;

  text-align:center;

  background:
    radial-gradient(circle at top,#250000,#050505 55%,#000);
}

.home-logo{
  width:min(60vw,300px);
  margin:auto;
}

.home-logo img{
  width:100%;

  filter:
    drop-shadow(0 0 10px #fff)
    drop-shadow(0 0 30px #ff0000);
}

#home h1{
  margin-top:25px;

  font-size:42px;
  letter-spacing:7px;

  text-shadow:0 0 25px red;
}

#home p{
  margin-top:12px;

  color:#aaa;
  letter-spacing:3px;
}

/* INSTAGRAM */

.instagram{
  max-width:500px;

  margin:40px auto;

  padding:30px 20px;

  border:1px solid #333;
  border-radius:20px;

  background:rgba(255,255,255,.04);

  box-shadow:
    0 0 30px rgba(255,0,0,.15);
}

.instagram h2{
  margin-bottom:10px;
}

.instagram a{
  display:inline-block;

  margin-top:20px;

  padding:13px 28px;

  border-radius:30px;

  color:#fff;
  text-decoration:none;

  background:linear-gradient(
    45deg,
    #ff0050,
    #ff7a00,
    #8a2be2
  );

  font-weight:bold;
}

.music{
  margin-top:20px;

  padding:12px 25px;

  border:1px solid #fff;
  border-radius:30px;

  background:transparent;
  color:#fff;

  cursor:pointer;
}

/* ===== ANIMATIONS ===== */

@keyframes openingIn{
  from{opacity:0}
  to{opacity:1}
}

@keyframes logoEnter{

  0%{
    opacity:0;
    transform:scale(.5) rotate(-3deg);
    filter:blur(20px);
  }

  60%{
    opacity:1;
    transform:scale(1.08) rotate(0);
    filter:blur(0);
  }

  100%{
    opacity:1;
    transform:scale(1);
  }
}

@keyframes logoPulse{

  from{
    transform:scale(1);
  }

  to{
    transform:scale(1.04);
  }
}

@keyframes fadeUp{

  from{
    opacity:0;
    transform:translateY(25px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }
}

@keyframes redGlow{

  from{
    transform:scale(.8);
    opacity:.12;
  }

  to{
    transform:scale(1.3);
    opacity:.25;
  }
}
</style>
</head>


<body>

<!-- MUSIC -->

<audio id="music" loop>
  <source
    src="Alan%20Walker_%20Sabrina%20Carpenter%20_%20Farruko%20-%20On%20My%20Way(MP3_160K).mp3"
    type="audio/mpeg">
</audio>


<!-- OPENING -->

<section id="opening">

  <div class="logo">
    <img src="logo.png" alt="HAZARD 69">
  </div>

  <div class="subtitle">
    OFFICIAL WEBSITE
  </div>

  <button class="enter" onclick="enterWebsite()">
    ENTER WEBSITE
  </button>

</section>


<!-- HOME -->

<section id="home">

  <div class="home-logo">
    <img src="logo.png" alt="HAZARD 69">
  </div>

  <h1>HAZARD 69</h1>

  <p>WELCOME TO THE OFFICIAL WEBSITE</p>


  <div class="instagram">

    <h2>📸 HAZARD 69 OFFICIAL</h2>

    <p>@hazard_69_official</p>

    <a
      href="https://www.instagram.com/hazard_69_official/"
      target="_blank">
      FOLLOW ON INSTAGRAM
    </a>

  </div>


  <button class="music" onclick="toggleMusic()">
    🎵 PLAY / PAUSE MUSIC
  </button>

</section>


<script>

function enterWebsite(){

  const music =
    document.getElementById("music");

  music.play().catch(function(){

    console.log(
      "Music playback requires user interaction."
    );

  });

  document.getElementById(
    "opening"
  ).style.display="none";

  document.getElementById(
    "home"
  ).style.display="block";

}


function toggleMusic(){

  const music =
    document.getElementById("music");

  if(music.paused){

    music.play();

  }else{

    music.pause();

  }

}

</script>

</body>
</html>
