<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HAZARD 69 OFFICIAL</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  background:#000;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}

/* OPENING */
#opening{
  position:fixed;
  inset:0;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  background:
    radial-gradient(circle at center,#222 0%,#080808 50%,#000 100%);
  z-index:999;
}

.logo{
  font-size:clamp(55px,14vw,120px);
  font-weight:900;
  letter-spacing:10px;
  text-shadow:
    0 0 10px #fff,
    0 0 30px #f00,
    0 0 60px #f00;
  animation:logoGlow 1.8s infinite alternate;
}

.subtitle{
  margin-top:12px;
  font-size:14px;
  letter-spacing:6px;
  color:#aaa;
}

.enter{
  margin-top:45px;
  padding:16px 42px;
  border:2px solid #fff;
  border-radius:40px;
  background:transparent;
  color:#fff;
  font-size:16px;
  font-weight:bold;
  letter-spacing:3px;
  cursor:pointer;
  transition:.3s;
}

.enter:hover{
  background:#fff;
  color:#000;
  box-shadow:0 0 35px #fff;
}

/* HOME */
#home{
  display:none;
  min-height:100vh;
  background:
    linear-gradient(135deg,#000,#160000,#000);
  text-align:center;
  padding-bottom:60px;
}

.hero{
  padding:80px 20px 50px;
}

.hero h1{
  font-size:clamp(40px,10vw,75px);
  letter-spacing:8px;
  text-shadow:0 0 25px red;
}

.hero p{
  margin-top:15px;
  color:#aaa;
  letter-spacing:3px;
}

/* INSTAGRAM */
.instagram{
  max-width:600px;
  margin:20px auto;
  padding:35px 20px;
  border:1px solid #333;
  border-radius:20px;
  background:rgba(255,255,255,.04);
  box-shadow:0 0 30px rgba(255,0,0,.15);
}

.instagram-icon{
  font-size:55px;
  margin-bottom:15px;
}

.instagram h2{
  font-size:28px;
  letter-spacing:3px;
}

.username{
  margin-top:10px;
  color:#aaa;
  font-size:18px;
}

.follow-btn{
  display:inline-block;
  margin-top:25px;
  padding:14px 30px;
  border-radius:30px;
  background:linear-gradient(45deg,#ff0050,#ff7a00,#8a2be2);
  color:#fff;
  text-decoration:none;
  font-weight:bold;
  letter-spacing:2px;
  transition:.3s;
}

.follow-btn:hover{
  transform:scale(1.05);
  box-shadow:0 0 25px #ff0050;
}

/* MUSIC */
.music-btn{
  margin-top:20px;
  padding:12px 25px;
  border:1px solid #fff;
  border-radius:25px;
  background:transparent;
  color:#fff;
  cursor:pointer;
}

/* FOOTER */
footer{
  margin-top:50px;
  color:#666;
  font-size:13px;
}

/* ANIMATION */
@keyframes logoGlow{
  from{
    transform:scale(1);
    text-shadow:
      0 0 10px #fff,
      0 0 25px #f00,
      0 0 45px #f00;
  }

  to{
    transform:scale(1.06);
    text-shadow:
      0 0 15px #fff,
      0 0 40px #f00,
      0 0 80px #f00;
  }
}
</style>
</head>

<body>

<!-- BACKGROUND MUSIC -->
<audio id="music" loop>
  <source
    src="Alan%20Walker_%20Sabrina%20Carpenter%20_%20Farruko%20-%20On%20My%20Way(MP3_160K).mp3"
    type="audio/mpeg">
</audio>


<!-- OPENING PAGE -->
<section id="opening">

  <div class="logo">
    HAZARD 69
  </div>

  <div class="subtitle">
    OFFICIAL WEBSITE
  </div>

  <button class="enter" onclick="enterWebsite()">
    ENTER WEBSITE
  </button>

</section>


<!-- HOME PAGE -->
<section id="home">

  <div class="hero">
    <h1>HAZARD 69</h1>
    <p>WELCOME TO THE OFFICIAL WEBSITE</p>
  </div>


  <!-- INSTAGRAM SECTION -->
  <div class="instagram">

    <div class="instagram-icon">
      📸
    </div>

    <h2>HAZARD 69 OFFICIAL</h2>

    <div class="username">
      @hazard_69_official
    </div>

    <a
      class="follow-btn"
      href="https://www.instagram.com/hazard_69_official/"
      target="_blank"
      rel="noopener noreferrer">
      FOLLOW ON INSTAGRAM
    </a>

  </div>


  <!-- MUSIC BUTTON -->
  <button class="music-btn" onclick="toggleMusic()">
    🎵 PLAY / PAUSE MUSIC
  </button>


  <footer>
    © 2026 HAZARD 69 OFFICIAL
  </footer>

</section>


<script>

function enterWebsite(){

  const music = document.getElementById("music");

  music.play().catch(function(){
    console.log("Music playback was blocked.");
  });

  document.getElementById("opening").style.display = "none";

  document.getElementById("home").style.display = "block";

}


function toggleMusic(){

  const music = document.getElementById("music");

  if(music.paused){
    music.play().catch(function(){});
  }else{
    music.pause();
  }

}

</script>

</body>
</html>
